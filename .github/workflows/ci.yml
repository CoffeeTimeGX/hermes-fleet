name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Windows unit tests with the restrict_dir fix (temporary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
